---
- name: Create GitLab credential in AWX
  hosts: localhost
  gather_facts: no
  vars:
    aap_url: "https://aap.example.com"
    aap_user: "admin"
    aap_pass: "changeme"
    gitlab_credential_name: "GitLab SCM"
    gitlab_username: "git"
    gitlab_token: ""
    gitlab_org: "Default"
  tasks:
    - name: Create or update GitLab credential
      awx.awx.credential:
        name: "{{ gitlab_credential_name }}"
        credential_type: "Source Control"
        organization: "{{ gitlab_org }}"
        inputs:
          username: "{{ gitlab_username }}"
          password: "{{ gitlab_token }}"
        state: present
        controller_host: "{{ aap_url }}"
        controller_username: "{{ aap_user }}"
        controller_password: "{{ aap_pass }}"
        validate_certs: yes
      register: credential_result

    - name: Show result
      ansible.builtin.debug:
        var: credential_result
