---
- name: Configure AAP for SAML
  hosts: localhost
  gather_facts: no
  vars:
    aap_url: "https://aap.example.com"
    aap_user: "admin"
    aap_pass: "changeme"
    idp_metadata_url: "https://idp.example.com/metadata"
    entity_id: "https://aap.example.com/saml/metadata"
  tasks:
    - name: Fetch IdP metadata
      ansible.builtin.uri:
        url: "{{ idp_metadata_url }}"
        return_content: yes
        validate_certs: yes
      register: idp_meta

    - name: Configure SAML settings via awx.awx.setting
      vars:
        saml_settings:
          SAML_ENABLED: true
          SOCIAL_AUTH_SAML_SP_ENTITY_ID: "{{ entity_id }}"
          SOCIAL_AUTH_SAML_IDP_METADATA: "{{ idp_meta.content }}"
          SOCIAL_AUTH_SAML_USER_ATTRMAP: '{"username":"uid","email":"email"}'
          SOCIAL_AUTH_SAML_CREATE_USERS: true
      awx.awx.setting:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        controller_host: "{{ aap_url }}"
        controller_username: "{{ aap_user }}"
        controller_password: "{{ aap_pass }}"
        validate_certs: yes
      loop: "{{ saml_settings | dict2items }}"
      register: saml_result

    - name: Show result
      ansible.builtin.debug:
        var: saml_result.json
